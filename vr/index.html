<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>VR — Liam Eggleston</title>
<meta name="description" content="WebXR visuals you can open in the browser or step inside with a headset.">
<link rel="stylesheet" href="/vr/vr.css">
<style>
    body {
        margin: 0;
        font-family: 'Geist', sans-serif;
        background: black;
        color: white;
    }

    body > header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        box-sizing: border-box;
        height: 60px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        background: #00000080;
        backdrop-filter: blur(15px);
        z-index: 1;

        display: flex;
        align-items: center;
    }
    body > header > a.name {
        margin-right: auto;
        font-size: 26px;
        font-family: 'Aktura', serif;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
    }
    body > header > a:not(.name) {
        position: relative;
        margin-left: 30px;
        opacity: 0.8;
        color: white;
        text-decoration: none;
        transition: opacity 0.2s;
    }
    body > header > a:not(.name) > span { color: var(--secondary); }
    body > header > a.name:hover { color: var(--gold); text-shadow: 0 0 14px color-mix(in srgb, var(--gold) 45%, transparent); }
    body > header > a.name { transition: color 0.2s, text-shadow 0.2s; }
    body > header > a:not(.name):hover { opacity: 1; text-shadow: 0 0 10px color-mix(in srgb, var(--gold) 60%, transparent); }
    body > header > a:not(.name)::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -6px;
        height: 2px;
        background: var(--gold);
        transform: scaleX(0);
        transition: transform 0.2s ease;
    }
    body > header > a:not(.name):hover::after { transform: scaleX(1); }

    main {
        padding: 60px max(20px, calc(50vw - 500px)) 0;
        overflow: hidden;
    }
    main > section { position: relative; }
    main > section > span.header {
        display: block;
        font-family: 'Aktura', serif;
        font-size: 84px;
        font-weight: normal;
        letter-spacing: 2px;
        line-height: 1;
        margin: 80px 0 24px;
    }
    main > section > span.header > span {
        color: var(--gold);
        font-family: 'Fira Code', monospace;
        font-size: 56px;
        animation: blink 1s steps(1) infinite;
    }
    main > section > span.lede {
        display: block;
        font-size: 18px;
        line-height: 25px;
        margin-bottom: 50px;
    }
    main > section > span.lede > em { font-style: normal; color: var(--gold); }

    /* The portfolio's blog list: mono label column, title, description */
    #visuals {
        position: relative;
        margin-bottom: 50px;
        padding-bottom: 30px;

        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    #visuals::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: linear-gradient(to right, transparent, color-mix(in srgb, var(--gold) 45%, transparent) 15%, color-mix(in srgb, var(--gold) 45%, transparent) 85%, transparent);
    }
    #visuals > a {
        display: block;
        color: inherit;
        text-decoration: none;
        border-radius: 8px;
    }
    #visuals > a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    #visuals > a > article {
        padding: 15px 0;
        font-size: 18px;
        color: var(--secondary);
        transition: scale 0.3s ease;

        display: grid;
        grid-template: auto auto / 200px 1fr;
        gap: 8px;
    }
    #visuals > a:hover > article { scale: 1.01; }
    #visuals > a > article > span.path {
        grid-area: span 2;
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        padding-top: 8px;
        color: color-mix(in srgb, var(--gold) 70%, transparent);
        transition: color 0.2s ease;
    }
    #visuals > a:hover > article > span.path,
    #visuals > a:focus-visible > article > span.path { color: var(--gold); }
    /* Titles set in the blackletter of the header's name */
    #visuals > a > article > span.title {
        font-family: 'Aktura', serif;
        font-size: 32px;
        letter-spacing: 1px;
        line-height: 1.1;
        text-transform: lowercase;          /* like the header's name; Aktura's capitals carry stray colour strokes */
        color: white;
        transition: color 0.2s ease, text-shadow 0.2s ease;
    }
    #visuals > a:hover > article > span.title,
    #visuals > a:focus-visible > article > span.title {
        color: var(--gold);
        text-shadow: 0 0 18px color-mix(in srgb, var(--gold) 35%, transparent);
    }
    #visuals > a > article > span.description { line-height: 1.4; }
    main > section > a.back {
        display: inline-block;
        margin-bottom: 80px;
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--gold);
        color: black;
        font-size: 16px;
        font-weight: 500;
        text-decoration: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    main > section > a.back:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--gold) 80%, transparent); }
    main > section > a.back:active { transform: translateY(0); }

    @media (max-width: 600px) {
        body > header > a.hide-narrow { display: none; }
        main > section > span.header { margin-top: 50px; font-size: 64px; }
        main > section > span.header > span { font-size: 44px; }
        #visuals > a > article > span.path { padding-top: 0; }
        #visuals > a > article { grid-template: auto / 1fr; }
        #visuals > a > article > span.path { grid-area: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
        main > section > span.header > span { animation: none; }
        #visuals > a > article, #visuals > a > article > span { transition: none; }
    }
</style>
</head>
<body>
    <header>
        <a class="name" href="/">liam eggleston</a>
        <a class="hide-narrow" href="/#projects"><span>cd </span>projects</a>
        <a class="hide-narrow" href="/blog.html"><span>cd </span>blog</a>
        <a href="/"><span>cd </span>~</a>
    </header>
    <main>
        <section>
            <span class="header">vr<span>_</span></span>
            <span class="lede">Shaders and simulations that run right in the browser. Open one on a WebXR headset and press <em>Enter VR</em> to step inside it.</span>
            <nav id="visuals"></nav>
            <a class="back" href="/">Back home</a>
        </section>
    </main>
    <script src="/vr/visuals.js"></script>
    <script>
        renderVisualList('#visuals', '/');
    </script>
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
