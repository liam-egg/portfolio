<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>VR — Liam Eggleston</title>
<meta name="description" content="WebXR visuals you can open in the browser or step inside with a headset.">
<link rel="stylesheet" href="/vr/vr.css">
<style>
    body {
        margin: 0;
        font-family: 'Geist', sans-serif;
        background: black;
        color: white;
    }

    body > header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        box-sizing: border-box;
        height: 60px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        background: #00000080;
        backdrop-filter: blur(15px);
        z-index: 1;

        display: flex;
        align-items: center;
    }
    body > header > a.name {
        margin-right: auto;
        font-size: 26px;
        font-family: 'Aktura', serif;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
    }
    body > header > a:not(.name) {
        position: relative;
        margin-left: 30px;
        opacity: 0.8;
        color: white;
        text-decoration: none;
        transition: opacity 0.2s;
    }
    body > header > a:not(.name) > span { color: var(--secondary); }
    body > header > a:not(.name):hover { opacity: 1; text-shadow: 0 0 10px #ffffffa0; }
    body > header > a:not(.name)::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -6px;
        height: 2px;
        background: #a0a0a0;
        transform: scaleX(0);
        transition: transform 0.2s ease;
    }
    body > header > a:not(.name):hover::after { transform: scaleX(1); }

    main {
        padding: 60px max(20px, calc(50vw - 500px)) 0;
        overflow: hidden;
    }
    main > section { position: relative; }
    main > section > span.header {
        display: block;
        font-size: 42px;
        font-weight: 500;
        margin: 80px 0 20px;
    }
    main > section > span.header > span {
        color: var(--secondary);
        animation: blink 1s steps(1) infinite;
    }
    main > section > span.lede {
        display: block;
        font-size: 18px;
        line-height: 25px;
        margin-bottom: 50px;
    }

    #visuals {
        margin-bottom: 50px;

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr));
        gap: 20px;
    }
    #visuals > a {
        color: inherit;
        text-decoration: none;
        border-radius: 10px;
    }
    #visuals > a > .window {
        height: 100%;
        box-sizing: border-box;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.2s ease;
    }
    #visuals > a:hover > .window,
    #visuals > a:focus-visible > .window {
        transform: translateY(-4px);
        box-shadow: 0 18px 44px -24px #000;
        border-color: #333;
    }
    #visuals > a:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; }
    #visuals > a:hover .dots > span:nth-child(1) { transform: translateY(-2px); }
    #visuals > a:hover .dots > span:nth-child(2) { transform: translateY(-2px); transition-delay: 0.04s; }
    #visuals > a:hover .dots > span:nth-child(3) { transform: translateY(-2px); transition-delay: 0.08s; }
    #visuals .window > header > .path { margin-left: auto; color: var(--gold); font-family: 'Fira Code', monospace; font-size: 13px; }

    main > section > span.note {
        display: block;
        margin-bottom: 30px;
        color: var(--secondary);
        font-family: 'Fira Code', monospace;
        font-size: 14px;
    }
    main > section > a.back {
        display: inline-block;
        margin-bottom: 80px;
        padding: 10px 16px;
        border-radius: 8px;
        background: white;
        color: black;
        font-size: 16px;
        text-decoration: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    main > section > a.back:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -10px #ffffff70; }
    main > section > a.back:active { transform: translateY(0); }

    @media (max-width: 600px) {
        body > header > a.hide-narrow,
        #visuals .window > header > .path { display: none; }
        main > section > span.header { margin-top: 50px; }
    }
    @media (prefers-reduced-motion: reduce) {
        main > section > span.header > span { animation: none; }
        #visuals > a > .window, .dots > span { transition: none; }
    }
</style>
</head>
<body>
    <header>
        <a class="name" href="/">liam eggleston</a>
        <a class="hide-narrow" href="/#projects"><span>cd </span>projects</a>
        <a class="hide-narrow" href="/blog.html"><span>cd </span>blog</a>
        <a href="/"><span>cd </span>~</a>
    </header>
    <main>
        <section>
            <span class="header">vr<span>_</span></span>
            <span class="lede">Shaders and simulations that run right in the browser. Open one on a WebXR headset and press <em>Enter VR</em> to step inside it.</span>
            <nav id="visuals"></nav>
            <span class="note">desktop: WASD to move, drag to look — each visual lists the rest</span>
            <a class="back" href="/">Back home</a>
        </section>
    </main>
    <script src="/vr/visuals.js"></script>
    <script>
        renderVisualList('#visuals', '/');
    </script>
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
